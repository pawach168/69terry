<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - สมัครสมาชิก</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            line-height: 1.5;
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
        }
        .banner {
            background-color: #f4d03f;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 36px;
            color: #333;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .form-row {
            margin-bottom: 6px;
        }
        hr {
            border: none;
            border-top: 1px solid #aaa;
            margin: 20px 0;
        }
        .question {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Quiz</h1>

    <!-- ส่วนแบนเนอร์ HTML5 (สามารถเปลี่ยนเป็น <img> ใส่รูปแบนเนอร์จริงได้) -->
    <div class="banner">
        HTML5
    </div>

    <form action="#" method="POST">
        
        <h2>ข้อมูลส่วนตัว</h2>

        <div class="form-row">
            <label for="fname">ชื่อจริง</label>
            <input type="text" id="fname" name="fname" required>
        </div>

        <div class="form-row">
            <label for="lname">นามสกุล</label>
            <input type="text" id="lname" name="lname" required>
        </div>

        <div class="form-row">
            <label for="bio">Bio</label><br>
            <textarea id="bio" name="bio" rows="3" cols="35"></textarea>
        </div>

        <div class="form-row">
            <label for="age">อายุ</label>
            <input type="number" id="age" name="age" min="1" max="120">
        </div>

        <div class="form-row">
            <label for="birthday">วันเกิด</label>
            <input type="date" id="birthday" name="birthday">
        </div>

        <div class="form-row">
            <label for="email">อีเมลล์</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-row">
            <label for="tel">เบอร์โทร</label>
            <input type="tel" id="tel" name="tel">
        </div>

        <div class="form-row">
            <label for="country">ประเทศ</label>
            <select id="country" name="country" required>
                <option value="">โปรดเลือกประเทศ</option>
                <option value="th">ประเทศไทย</option>
                <option value="jp">ญี่ปุ่น</option>
                <option value="us">สหรัฐอเมริกา</option>
            </select>
        </div>

        <div class="form-row">
            เพศ :
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">ชาย</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">หญิง</label>
            <input type="radio" id="other" name="gender" value="other">
